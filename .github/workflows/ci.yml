name: CI

# Every push and pull request: build, unit tests and end-to-end capture tests on every supported platform, and the
# packages for it. Pushes to main additionally publish those packages as a GitHub release (job "release"), only after
# every platform passed.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Avalonia's build reports anonymous usage statistics unless this is set.
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build and test (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows arm64 is not built: WinDivert has no arm64 driver and the hook DLLs are x64/x86.
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        shell: bash
        run: echo "VERSION=$(./build/version.sh)" >> "$GITHUB_ENV"

      # The injection mode's hook DLLs (C++, Microsoft Detours), x64 and x86. Built first: the .NET build copies them.
      - name: Build hook DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/build-native.ps1

      # The Linux capture parts (eBPF programs, LD_PRELOAD library) for this architecture. Built first: the .NET
      # build copies them.
      - name: Build Linux capture parts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev
          ./build/build-native.sh

      - name: Restore
        run: dotnet restore Proxynator.sln

      - name: Build
        run: dotnet build Proxynator.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test Proxynator.sln -c Release --no-build --filter "Category!=Integration" --logger trx --results-directory TestResults

      # The integration tests build a venv to reproduce how pipx tools (console-script launcher -> python.exe) run.
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      # Real traffic through the WinDivert and injection capture backends. GitHub's Windows runners are elevated; the
      # variable turns a skipped test (no admin / not Windows / no hook DLLs) into a failure so this can never pass
      # silently.
      - name: Integration tests (WinDivert, injection)
        if: runner.os == 'Windows'
        env:
          PROXYNATOR_REQUIRE_INTEGRATION: '1'
        run: dotnet test tests/Proxynator.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --logger "console;verbosity=detailed" --results-directory TestResults

      # Self-contained builds (no .NET install needed) of proxynatord, proxynator and proxynator-gui with the native
      # capture parts: a .deb (Ubuntu, Kali) and a .tar.gz (other distributions) per architecture.
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: |
          for project in Service Cli Gui; do
            dotnet publish src/Proxynator.$project -c Release -r ${{ matrix.rid }} --self-contained -p:Version=$VERSION -p:GenerateDocumentationFile=false -o publish/${{ matrix.rid }}
          done
          ./build/package-deb.sh publish/${{ matrix.rid }} "$VERSION" packages
          ./build/package-tar.sh publish/${{ matrix.rid }} "$VERSION" ${{ matrix.rid }} packages

      # Real traffic through the eBPF programs and the preload library (curl, sh, python3). Needs root; the
      # variable turns a skip into a failure. Runs after the other build steps, as root, so it cannot leave
      # root-owned files behind for them.
      - name: Integration tests (eBPF, preload)
        if: runner.os == 'Linux'
        run: sudo -E env "PATH=$PATH" "DOTNET_ROOT=${DOTNET_ROOT:-}" PROXYNATOR_REQUIRE_INTEGRATION=1 dotnet test tests/Proxynator.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --logger "console;verbosity=detailed" --results-directory TestResults

      # A self-contained .zip with proxynatord, proxynator, proxynator-gui, the WinDivert driver and the hook DLLs.
      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "publish/proxynator-$env:VERSION-win-x64"
          foreach ($project in 'Service', 'Cli', 'Gui') {
            dotnet publish src/Proxynator.$project -c Release -r win-x64 --self-contained -p:Version=$env:VERSION -p:GenerateDocumentationFile=false -o $out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($file in 'proxynatord.exe', 'proxynator.exe', 'proxynator-gui.exe', 'WinDivert.dll', 'WinDivert64.sys', 'proxynator-hook64.dll', 'proxynator-hook32.dll') {
            if (-not (Test-Path "$out/$file")) { throw "missing $out/$file" }
          }
          New-Item -ItemType Directory -Force "$out/samples", packages | Out-Null
          Copy-Item samples/*.json "$out/samples/"
          Copy-Item LICENSE, NOTICE, README.md $out
          Compress-Archive -Path $out -DestinationPath "packages/proxynator-$env:VERSION-win-x64.zip"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.rid }}
          path: packages/*
          if-no-files-found: error

      # Screenshots of every GUI page, rendered by the headless GUI tests.
      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots-${{ matrix.rid }}
          path: tests/Proxynator.Gui.Tests/bin/Release/net10.0/screenshots
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults
          if-no-files-found: ignore

  # Pushes to main: every platform's packages, tested above, become a GitHub release v<major>.<minor>.<run number>.
  release:
    name: Release
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: echo "VERSION=$(./build/version.sh)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          Built and tested by CI from ${GITHUB_SHA}: unit tests and real-traffic capture tests on every platform below.

          | Platform | Package |
          |---|---|
          | Windows 10/11 x64 | \`proxynator-${VERSION}-win-x64.zip\`: unzip, run \`proxynatord.exe\` as Administrator |
          | Ubuntu / Kali x64 | \`proxynator_${VERSION}_amd64.deb\`: \`sudo apt install ./proxynator_${VERSION}_amd64.deb\` |
          | Ubuntu / Kali arm64 | \`proxynator_${VERSION}_arm64.deb\` |
          | Other Linux x64 / arm64 | \`proxynator-${VERSION}-linux-x64.tar.gz\` / \`-linux-arm64.tar.gz\`: unpack, run \`proxynatord\` as root (systemd unit and desktop entry in \`packaging/\`) |

          Each package contains the service (\`proxynatord\`), the CLI (\`proxynator\`) and the GUI (\`proxynator-gui\`). \`SHA256SUMS\` lists the checksums.
          NOTES
          gh release create "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Proxynator ${VERSION}" --notes-file notes.md --generate-notes
