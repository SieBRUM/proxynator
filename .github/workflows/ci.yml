name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Proxynator.sln

      - name: Build
        run: dotnet build Proxynator.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test Proxynator.sln -c Release --no-build --filter "Category!=Integration" --logger trx --results-directory TestResults

      # Real traffic through the WinDivert capture backend. GitHub's Windows runners are elevated; the variable
      # turns a skipped test (no admin / not Windows) into a failure so this can never pass silently.
      - name: Integration tests (WinDivert)
        if: runner.os == 'Windows'
        env:
          PROXYNATOR_REQUIRE_INTEGRATION: '1'
        run: dotnet test tests/Proxynator.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --logger "console;verbosity=detailed" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

      # A self-contained build (no .NET install needed) with proxynatord, proxynator and the WinDivert driver.
      - name: Publish Windows build
        if: runner.os == 'Windows'
        run: |
          dotnet publish src/Proxynator.Service -c Release -r win-x64 --self-contained -o publish/proxynator-win-x64
          dotnet publish src/Proxynator.Cli -c Release -r win-x64 --self-contained -o publish/proxynator-win-x64
          Copy-Item samples/config.json, LICENSE, NOTICE publish/proxynator-win-x64/

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: proxynator-win-x64
          path: publish/proxynator-win-x64
