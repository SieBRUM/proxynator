name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The injection mode's hook DLLs (C++, Microsoft Detours), x64 and x86. Built first: the .NET build copies them.
      - name: Build hook DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/build-native.ps1

      # The Linux capture parts (eBPF programs, LD_PRELOAD library). Built first: the .NET build copies them.
      - name: Build Linux capture parts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev
          ./build/build-native.sh

      - name: Restore
        run: dotnet restore Proxynator.sln

      - name: Build
        run: dotnet build Proxynator.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test Proxynator.sln -c Release --no-build --filter "Category!=Integration" --logger trx --results-directory TestResults

      # The integration tests build a venv to reproduce how pipx tools (console-script launcher -> python.exe) run.
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      # Real traffic through the WinDivert and injection capture backends. GitHub's Windows runners are elevated; the
      # variable turns a skipped test (no admin / not Windows / no hook DLLs) into a failure so this can never pass
      # silently.
      - name: Integration tests (WinDivert, injection)
        if: runner.os == 'Windows'
        env:
          PROXYNATOR_REQUIRE_INTEGRATION: '1'
        run: dotnet test tests/Proxynator.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --logger "console;verbosity=detailed" --results-directory TestResults

      # A self-contained build packaged as a .deb for Ubuntu and Kali (proxynatord, proxynator, the eBPF object,
      # the preload library, a systemd unit and a default configuration).
      - name: Build Debian package
        if: runner.os == 'Linux'
        run: |
          dotnet publish src/Proxynator.Service -c Release -r linux-x64 --self-contained -o publish/linux-x64
          dotnet publish src/Proxynator.Cli -c Release -r linux-x64 --self-contained -o publish/linux-x64
          ./build/package-deb.sh publish/linux-x64 0.1.0 publish

      - name: Upload Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: proxynator-linux-x64-deb
          path: publish/*.deb

      # Real traffic through the eBPF programs and the preload library (curl, sh, python3). Needs root; the
      # variable turns a skip into a failure. Runs last, as root, so it cannot leave root-owned files behind for
      # the other steps.
      - name: Integration tests (eBPF, preload)
        if: runner.os == 'Linux'
        run: sudo -E env "PATH=$PATH" "DOTNET_ROOT=${DOTNET_ROOT:-}" PROXYNATOR_REQUIRE_INTEGRATION=1 dotnet test tests/Proxynator.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --logger "console;verbosity=detailed" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

      # A self-contained build (no .NET install needed) with proxynatord, proxynator, the WinDivert driver and the
      # hook DLLs.
      - name: Publish Windows build
        if: runner.os == 'Windows'
        run: |
          dotnet publish src/Proxynator.Service -c Release -r win-x64 --self-contained -o publish/proxynator-win-x64
          dotnet publish src/Proxynator.Cli -c Release -r win-x64 --self-contained -o publish/proxynator-win-x64
          New-Item -ItemType Directory -Force publish/proxynator-win-x64/samples | Out-Null
          Copy-Item samples/*.json publish/proxynator-win-x64/samples/
          Copy-Item LICENSE, NOTICE publish/proxynator-win-x64/

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: proxynator-win-x64
          path: publish/proxynator-win-x64
